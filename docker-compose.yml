services:
  db:
    image: mysql:8.0
    container_name: nailkery-citas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: nailkery_citas
      MYSQL_USER: nailkery_user
      MYSQL_PASSWORD: secret
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nailkery-citas-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Nailkery Citas"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: nailkery_citas
      DB_USERNAME: nailkery_user
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html

volumes:
  db_data:
